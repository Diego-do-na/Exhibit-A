name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Run tests (excluding docker, ollama and integration)
        run: pytest -m 'not docker and not ollama and not integration'

  sandbox:
    name: sandbox ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Pre-build sandbox images once
        run: python -m exhibit_a.ci.sandbox_shards --prebuild

      - name: Run docker-marked tests (shard ${{ matrix.shard }}/4)
        run: python -m exhibit_a.ci.sandbox_shards --group ${{ matrix.shard }} --run

  sandbox-complete:
    name: sandbox-complete
    needs: sandbox
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every sandbox shard
        run: |
          echo "sandbox matrix result: ${{ needs.sandbox.result }}"
          if [ "${{ needs.sandbox.result }}" != "success" ]; then
            echo "one or more sandbox shards failed or were cancelled"
            exit 1
          fi
