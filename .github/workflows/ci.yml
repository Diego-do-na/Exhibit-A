name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Run tests (excluding docker, ollama and integration)
        run: pytest -m 'not docker and not ollama and not integration'

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Build sandbox image (same as src/exhibit_a/sandbox.build_image)
        run: python -c "from exhibit_a.sandbox.image import build_image; print(build_image([]))"

      - name: Run docker-marked tests
        run: pytest -m docker
