# Exhibit A on every pull request. Template: copy it to your repository.
#
# Red only when a finding is PROVEN by execution in an isolated,
# resource-limited sandbox. Green means "nothing could be proven", never
# "safe". See docs/ci/github-action.md and docs/ci/github-action-security.md.
#
# Opt-in: both jobs stay skipped until the repository variable
# EXHIBIT_A_ENABLED is "true", so this file is inert until the protected
# environment and its secret exist (setup steps in docs/ci/github-action.md).
#
# On this repository it runs only for pull requests that touch
# examples/action-demo and analyses only that directory's diff (runbook:
# docs/ci/live-pr-demo.md). Copying the template elsewhere: drop `paths` and the
# "Scope the diff" step, and point `working-directory` at your code.

name: Exhibit A

on:
  # Never pull_request_target: it runs with secrets in the base repository's
  # context and is the classic way to leak them to untrusted PR code.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - examples/action-demo/**

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

# A new push to the same PR cancels the superseded run.
concurrency:
  group: exhibit-a-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: exhibit-a / verify
    # Same-repository PRs only. Fork PRs are out of scope: see fork-guard.
    if: >-
      vars.EXHIBIT_A_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Protected environment: required reviewers approve each run before the
    # job (and its environment secret) starts.
    environment: exhibit-a
    permissions:
      contents: read
      pull-requests: write  # only for the summary comment; drop with comment: "false"
    steps:
      - name: Check out the PR head
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0  # the base commit is needed for the PR diff

      - name: Scope the diff to examples/action-demo
        id: scope
        # The engine stages the whole working directory and runs its baseline on it,
        # so analysing the repository root would run this repository's own tests as
        # the "baseline". Instead, build a throwaway repository whose root is
        # examples/action-demo: two commits made from the base and head subtrees.
        # Only git objects are copied (commit-tree), nothing is extracted or run.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha='^[0-9a-f]{40}$'
          [[ "$BASE_SHA" =~ $sha && "$HEAD_SHA" =~ $sha ]] || { echo "::error::unexpected commit ids"; exit 1; }
          empty=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          tree() { git rev-parse --verify --quiet "$1:examples/action-demo" || echo "$empty"; }
          export GIT_AUTHOR_NAME=exhibit-a GIT_AUTHOR_EMAIL=exhibit-a@localhost
          export GIT_COMMITTER_NAME=exhibit-a GIT_COMMITTER_EMAIL=exhibit-a@localhost
          base_commit="$(git commit-tree "$(tree "$BASE_SHA")" -m "scope: base")"
          head_commit="$(git commit-tree "$(tree "$HEAD_SHA")" -p "$base_commit" -m "scope: head")"
          scope="$GITHUB_WORKSPACE/.exhibit-a-scope"
          rm -rf "$scope"
          git init -q "$scope"
          git update-ref refs/exhibit-a-scope/base "$base_commit"
          git update-ref refs/exhibit-a-scope/head "$head_commit"
          git -C "$scope" fetch -q --no-tags "$GITHUB_WORKSPACE" "+refs/exhibit-a-scope/*:refs/exhibit-a-scope/*"
          git -C "$scope" checkout -q --detach "$head_commit"
          echo "base=$base_commit" >> "$GITHUB_OUTPUT"
          echo "head=$head_commit" >> "$GITHUB_OUTPUT"

      - name: Exhibit A
        id: exhibit
        # TODO(A-9): pin to the full 40-character commit SHA of a reviewed
        # Exhibit A release, e.g. diego-do-na/Exhibit-A@<sha> # v0.1.0.
        # Do NOT use "./" here: it would run the action.yml from the PR
        # itself, which the PR author controls.
        uses: diego-do-na/Exhibit-A@TODO-pin-full-commit-sha
        with:
          provider: meta
          model: muse-wonder-1.0
          api-key: ${{ secrets.EXHIBIT_A_API_KEY }}  # environment secret
          api-key-env: META_API_KEY
          fail-on: proven
          working-directory: .exhibit-a-scope
          base-sha: ${{ steps.scope.outputs.base }}
          head-sha: ${{ steps.scope.outputs.head }}
          profile: compact
          max-runtime-minutes: "20"
          budget-usd: "1"
          comment: "true"

      - name: Report outputs
        if: always()
        env:
          STATUS: ${{ steps.exhibit.outputs.status }}
          PROVEN: ${{ steps.exhibit.outputs.proven }}
          RISK: ${{ steps.exhibit.outputs.risk }}
        run: echo "status=$STATUS proven=$PROVEN risk=$RISK"

  fork-guard:
    name: exhibit-a / fork-guard
    # Fork PRs get no secrets and are not analysed. A skipped job reports
    # success to branch protection, so this job fails instead: mark it
    # required too, and a fork PR cannot pass silently.
    if: >-
      vars.EXHIBIT_A_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fork PRs are out of scope
        run: |
          {
            echo "## Exhibit A: fork PR not analysed"
            echo
            echo "Pull requests from forks are out of scope: they cannot receive the model"
            echo "API key safely. Nothing was verified, so nothing could be proven."
            echo "A maintainer must review this PR by hand."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Exhibit A::fork PRs are not analysed; a maintainer must review"
          exit 1
