[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exhibit-a"
version = "0.1.0"
description = "Proof before accusation: report only vulnerabilities that can be proven by execution."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "anyio>=3.4,<5", "pyyaml>=6", "jinja2>=3"]

[project.scripts]
exhibit-a = "exhibit_a.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exhibit_a = [
    "sandbox/seccomp.json",
    "sandbox/witness/*",
    "graph/js/*",
    "oracle/js/*",
    "advisory/symbols.json",
    "schemas/*.json",
    "cli/logo.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "docker: needs a running Docker daemon",
    "ollama: needs a local Ollama server",
    "integration: end-to-end test that touches real external resources",
]
