name: Exhibit A
description: >-
  Run the Exhibit A verification engine on a pull request. The check is red
  only when a finding is proven by execution; green means "nothing could be
  proven", never "safe".
author: Exhibit A contributors
branding:
  icon: shield
  color: gray-dark

# Security notes (details in docs/ci/github-action-security.md):
# - Every input reaches shell code through env vars, never through ${{ }}
#   inside a script, so a crafted input cannot inject commands.
# - The model API key is materialised only in the "Run Exhibit A" step and is
#   scanned for in every file before anything is uploaded.
# - Third-party actions are pinned by full commit SHA.
# - Uploading SARIF findings (sarif: true, default) requires the calling workflow
#   to declare permissions: security-events: write.

inputs:
  provider:
    description: Model provider for the roles (replay, ollama, openai_compatible, meta).
    required: false
    default: meta
  model:
    description: Model name for every role. Empty lets the engine choose its default.
    required: false
    default: ""
  api-key:
    description: >-
      Model API key. Pass a secret from a protected environment, e.g.
      secrets.EXHIBIT_A_API_KEY. Never a literal value.
    required: false
    default: ""
  api-key-env:
    description: Name of the environment variable the provider reads the key from.
    required: false
    default: META_API_KEY
  profile:
    description: >-
      Prompt profile passed to --profile. compact bounds every model answer to cut
      cost and is the default for pull-request runs; standard matches the recorded
      replays. compact cannot be used with replay.
    required: false
    default: compact
  fail-on:
    description: "proven: fail the check when a proven finding exists. never: report only."
    required: false
    default: proven
  working-directory:
    description: Repository directory to analyse, relative to the workspace.
    required: false
    default: "."
  max-runtime-minutes:
    description: Hard wall-clock limit for the engine run (1-360).
    required: false
    default: "30"
  budget-usd:
    description: Hard model-cost limit in USD (passed to --budget-usd). Empty means none.
    required: false
    default: ""
  base-sha:
    description: Base commit for the PR diff. Defaults to the pull_request base SHA.
    required: false
    default: ""
  head-sha:
    description: Head commit for the PR diff. Defaults to the pull_request head SHA.
    required: false
    default: ""
  case:
    description: >-
      Optional benchmark case.json (relative to working-directory) to run instead
      of the PR-diff surface. Useful for smoke-testing the Action.
    required: false
    default: ""
  replay:
    description: Replay recorded model calls (true/false). Only meaningful with a case.
    required: false
    default: "false"
  risk-gate:
    description: "true: skip exploits for docs/tests-only PRs. false: always run."
    required: false
    default: "true"
  comment:
    description: Post or update one PR comment with the summary (needs pull-requests write).
    required: false
    default: "false"
  suggest-fixes:
    description: Post verified fix hunks as GitHub review suggestions (needs pull-requests write).
    required: false
    default: "true"
  open-fix-pr:
    description: Push a verified fix branch and open a PR (never for fork PRs; needs contents write).
    required: false
    default: "false"
  comment-author:
    description: Login whose marker comment is updated in place.
    required: false
    default: github-actions[bot]
  sarif:
    description: >-
      Upload proven findings to GitHub Code Scanning as SARIF (needs security-events: write).
    required: false
    default: "true"
  github-token:
    description: Token used only for the PR comment.
    required: false
    default: ${{ github.token }}
  python-version:
    description: Python used to run the engine.
    required: false
    default: "3.11"
  artifact-name:
    description: Name of the uploaded ledger artifact.
    required: false
    default: exhibit-a-ledger
  artifact-retention-days:
    description: Days to keep the ledger artifact.
    required: false
    default: "14"

outputs:
  status:
    description: completed, aborted, timed_out, not_run or skipped.
    value: ${{ steps.summary.outputs.status }}
  proven:
    description: Number of proven findings.
    value: ${{ steps.summary.outputs.proven }}
  dropped:
    description: Suspicions judged but not proven.
    value: ${{ steps.summary.outputs.dropped }}
  discarded-unproven:
    description: Count of discarded_unproven verdicts.
    value: ${{ steps.summary.outputs.discarded-unproven }}
  invalid-test:
    description: Count of invalid_test verdicts.
    value: ${{ steps.summary.outputs.invalid-test }}
  flaky:
    description: Count of flaky verdicts.
    value: ${{ steps.summary.outputs.flaky }}
  env-failure:
    description: Count of env_failure verdicts.
    value: ${{ steps.summary.outputs.env-failure }}
  risk:
    description: Risk gate classification (low, medium, high).
    value: ${{ steps.gate.outputs.risk }}
  result-json:
    description: Path of the machine-readable result (schema_version 1).
    value: ${{ steps.summary.outputs.result-json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      # actions/setup-python v7.1.0
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validate inputs and install Exhibit A
      id: setup
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_PROFILE: ${{ inputs.profile }}
        IN_WORKDIR: ${{ inputs.working-directory }}
        IN_MAX_MINUTES: ${{ inputs.max-runtime-minutes }}
        IN_BUDGET: ${{ inputs.budget-usd }}
        IN_KEY_ENV: ${{ inputs.api-key-env }}
        IN_CASE: ${{ inputs.case }}
        IN_REPLAY: ${{ inputs.replay }}
        IN_RISK_GATE: ${{ inputs.risk-gate }}
        IN_COMMENT: ${{ inputs.comment }}
        IN_SUGGEST_FIXES: ${{ inputs.suggest-fixes }}
        IN_OPEN_FIX_PR: ${{ inputs.open-fix-pr }}
        IN_SARIF: ${{ inputs.sarif }}
        IN_RETENTION: ${{ inputs.artifact-retention-days }}
      run: |
        set -euo pipefail
        fail() { echo "::error title=Exhibit A::$1"; exit 1; }
        case "$IN_FAIL_ON" in proven|never) ;; *) fail "fail-on must be 'proven' or 'never'";; esac
        [[ "$IN_MAX_MINUTES" =~ ^[0-9]+$ ]] && (( IN_MAX_MINUTES >= 1 && IN_MAX_MINUTES <= 360 )) \
          || fail "max-runtime-minutes must be an integer from 1 to 360"
        case "$IN_PROFILE" in standard|compact) ;; *) fail "profile must be 'standard' or 'compact'";; esac
        [[ "$IN_PROFILE" == "compact" && "$IN_REPLAY" == "true" ]] && fail "profile compact cannot be combined with replay"
        [[ -z "$IN_BUDGET" || "$IN_BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || fail "budget-usd must be a number"
        [[ "$IN_KEY_ENV" =~ ^[A-Z_][A-Z0-9_]*$ ]] || fail "api-key-env must be an upper-case variable name"
        case "$IN_KEY_ENV" in PATH|HOME|PYTHONPATH|LD_*|GITHUB_*|RUNNER_*|EXHIBIT_A_*) fail "api-key-env may not shadow $IN_KEY_ENV";; esac
        for flag in "$IN_REPLAY" "$IN_RISK_GATE" "$IN_COMMENT" "$IN_SARIF" "$IN_SUGGEST_FIXES" "$IN_OPEN_FIX_PR"; do
          case "$flag" in true|false) ;; *) fail "boolean inputs must be 'true' or 'false'";; esac
        done
        # A case run installs the case's requirements and executes its baseline
        # on the host with the step's environment in reach (audit F8). Live
        # case execution is refused: only replay runs are allowed, and the
        # engine step exports no key on the case path.
        if [[ -n "$IN_CASE" && "$IN_REPLAY" != "true" ]]; then
          fail "case runs require replay: 'true'"
        fi
        [[ "$IN_RETENTION" =~ ^[0-9]+$ ]] || fail "artifact-retention-days must be an integer"

        workspace="$(realpath "$GITHUB_WORKSPACE")"
        workdir="$(realpath -m "$workspace/$IN_WORKDIR")"
        [[ "$workdir" == "$workspace" || "$workdir" == "$workspace/"* ]] || fail "working-directory must stay inside the workspace"
        [[ -d "$workdir" ]] || fail "working-directory does not exist"

        out="$RUNNER_TEMP/exhibit-a"
        rm -rf "$out"
        mkdir -p "$out/run" "$out/report"
        python -m venv "$out/venv"
        "$out/venv/bin/python" -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"
        {
          echo "workdir=$workdir"
          echo "out=$out"
          echo "python=$out/venv/bin/python"
        } >> "$GITHUB_OUTPUT"

    - name: Classify PR risk
      id: gate
      shell: bash
      env:
        WORKDIR: ${{ steps.setup.outputs.workdir }}
        OUT: ${{ steps.setup.outputs.out }}
        PY: ${{ steps.setup.outputs.python }}
        IN_BASE_SHA: ${{ inputs.base-sha }}
        EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        IN_RISK_GATE: ${{ inputs.risk-gate }}
      run: |
        set -euo pipefail
        base="${IN_BASE_SHA:-$EVENT_BASE_SHA}"
        : > "$OUT/report/changed-files.txt"
        if [[ -n "$base" ]]; then
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=Exhibit A::base-sha must be a full commit SHA"; exit 1; }
          if ! git -C "$WORKDIR" cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::error title=Exhibit A::base commit not in the checkout; use actions/checkout with fetch-depth: 0"
            exit 1
          fi
          git -C "$WORKDIR" -c core.quotePath=false diff --no-ext-diff --no-textconv --name-only "$base...HEAD" -- . \
            > "$OUT/report/changed-files.txt"
          "$PY" -m exhibit_a.ci.gate --files "$OUT/report/changed-files.txt" > "$OUT/report/risk.json"
        else
          echo "::warning title=Exhibit A::no base commit (not a pull_request event?); treating the change as high risk"
          printf '%s\n' '{"reasons": {}, "risk": "high", "should_run_exploits": true}' > "$OUT/report/risk.json"
        fi
        risk="$("$PY" -c 'import json,sys; print(json.load(open(sys.argv[1]))["risk"])' "$OUT/report/risk.json")"
        should_run="$("$PY" -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["should_run_exploits"]).lower())' "$OUT/report/risk.json")"
        if [[ "$IN_RISK_GATE" == "false" ]]; then should_run=true; fi
        echo "Risk: $risk, run exploits: $should_run"
        { echo "risk=$risk"; echo "should-run=$should_run"; } >> "$GITHUB_OUTPUT"

    - name: Run Exhibit A
      id: engine
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      env:
        # The key exists only in this step's environment. It is copied to the
        # variable the provider reads and removed from this name immediately.
        # It is exported only on the PR-diff path: a case run executes
        # PR-controlled installs and baselines on the host, so the key is
        # never in reach there (audit F8). Case runs need no key (replay).
        EXHIBIT_A_API_KEY: ${{ inputs.api-key }}
        IN_KEY_ENV: ${{ inputs.api-key-env }}
        IN_PROVIDER: ${{ inputs.provider }}
        IN_MODEL: ${{ inputs.model }}
        IN_PROFILE: ${{ inputs.profile }}
        WORKDIR: ${{ steps.setup.outputs.workdir }}
        OUT: ${{ steps.setup.outputs.out }}
        IN_MAX_MINUTES: ${{ inputs.max-runtime-minutes }}
        IN_BUDGET: ${{ inputs.budget-usd }}
        IN_CASE: ${{ inputs.case }}
        IN_REPLAY: ${{ inputs.replay }}
        IN_BASE_SHA: ${{ inputs.base-sha }}
        IN_HEAD_SHA: ${{ inputs.head-sha }}
        EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail
        key="$EXHIBIT_A_API_KEY"
        unset EXHIBIT_A_API_KEY
        # Values from secrets are already masked in logs by the runner; the
        # key is never printed, not even to register a mask.
        if [[ -n "$IN_CASE" ]]; then
          # Replay case runs authenticate nothing: keep the key out of reach
          # of the PR-controlled code this path executes on the host.
          key=""
        fi
        [[ -n "$key" ]] && export "$IN_KEY_ENV=$key"
        if ! docker info > /dev/null 2>&1; then
          echo "::warning title=Exhibit A::docker info failed; sandbox runs will end as env_failure"
        fi

        args=(run --repo "$WORKDIR" --out "$OUT/run")
        if [[ -n "$IN_CASE" ]]; then
          args+=(--case "$WORKDIR/$IN_CASE")
        else
          base="${IN_BASE_SHA:-$EVENT_BASE_SHA}"
          head="${IN_HEAD_SHA:-$EVENT_HEAD_SHA}"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=Exhibit A::base-sha must be a full commit SHA"; exit 1; }
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=Exhibit A::head-sha must be a full commit SHA"; exit 1; }
          # Both SHAs are validated above and stay quoted: never interpolated
          # into shell unquoted, so a crafted value cannot inject commands.
          args+=(--pr-diff "$base..$head" --provider "$IN_PROVIDER" --profile "$IN_PROFILE" --slice)
          [[ -n "$IN_MODEL" ]] && args+=(--model "$IN_MODEL")
          [[ "$EVENT_PR_NUMBER" =~ ^[0-9]+$ ]] && args+=(--pr "$EVENT_PR_NUMBER")
        fi
        [[ "$IN_REPLAY" == "true" ]] && args+=(--replay)
        [[ -n "$IN_BUDGET" ]] && args+=(--budget-usd "$IN_BUDGET")

        # CLI exit codes (docs/reference/cli-exit-codes.md): 0 ran, nothing proven;
        # 10 ran, at least one finding proven; 20 incomplete (timeout,
        # environment or model failure); 2 usage or input error, for example
        # an unsupported provider. Only 0 and 10 continue to the summary;
        # anything else fails the check here so a crash can never look
        # green. 124/137 come from timeout itself and mean the time limit hit.
        # GitHub runs bash with -e, so capture the code instead of dying on it.
        code=0
        timeout --signal=TERM --kill-after=30s "${IN_MAX_MINUTES}m" \
          "$OUT/venv/bin/exhibit-a" "${args[@]}" || code=$?
        case "$code" in
          0|10|124|137) ;;
          20) echo "::error title=Exhibit A::the run was incomplete (timeout, environment failure or model error); nothing could be proven"; exit 1 ;;
          2) echo "::error title=Exhibit A::the engine reported a usage or input error (for example an unsupported provider); nothing could be proven"; exit 1 ;;
          *) echo "::error title=Exhibit A::the engine exited with code $code; nothing could be proven"; exit 1 ;;
        esac
        echo "engine-exit=$code" >> "$GITHUB_OUTPUT"

        if [[ -n "$key" ]] && grep -rqF -f <(printf '%s\n' "$key") "$OUT/run" "$OUT/report"; then
          echo "::error title=Exhibit A::the API key was found in the run output; refusing to publish it"
          rm -rf "$OUT/run" "$OUT/report"
          exit 1
        fi
        exit 0

    - name: Write summary and result JSON
      id: summary
      # Skipped when the engine step failed (e.g. the key leaked into the
      # output and the files were deleted): then nothing is published.
      if: always() && steps.setup.outcome == 'success' && steps.engine.outcome != 'failure'
      shell: bash
      env:
        OUT: ${{ steps.setup.outputs.out }}
        PY: ${{ steps.setup.outputs.python }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        ENGINE_EXIT: ${{ steps.engine.outputs.engine-exit }}
        SHOULD_RUN: ${{ steps.gate.outputs.should-run }}
      run: |
        set -euo pipefail
        args=(build --ledger "$OUT/run/ledger.jsonl" --out-dir "$OUT/report"
              --fail-on "$IN_FAIL_ON" --step-summary "$GITHUB_STEP_SUMMARY"
              --github-output "$GITHUB_OUTPUT")
        [[ -f "$OUT/report/risk.json" ]] && args+=(--risk "$OUT/report/risk.json")
        [[ -n "$ENGINE_EXIT" ]] && args+=(--engine-exit "$ENGINE_EXIT")
        if [[ "$SHOULD_RUN" == "false" ]]; then
          args+=(--skipped-reason "risk gate: only documentation or tests changed")
        fi
        "$PY" -m exhibit_a.ci.summary "${args[@]}"
        # The surface must have run: an empty ledger (surface_ran false)
        # means nothing was verified, and that must fail, never pass.
        # A skipped risk-gate run is the only exception.
        surface="$("$PY" -c 'import json,sys; print(json.load(open(sys.argv[1]))["surface_ran"])' "$OUT/report/result.json")"
        result_status="$("$PY" -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$OUT/report/result.json")"
        if [[ "$result_status" != "skipped" && "$surface" != "True" ]]; then
          echo "::error title=Exhibit A::the verification surface did not run (surface_ran is false); nothing was verified"
          exit 1
        fi
        cp "$OUT/run/ledger.jsonl" "$OUT/report/ledger.jsonl" 2>/dev/null || true
        echo "result-json=$OUT/report/result.json" >> "$GITHUB_OUTPUT"

    - name: Post or update PR comment
      if: always() && inputs.comment == 'true' && steps.summary.outcome == 'success' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUT: ${{ steps.setup.outputs.out }}
        PY: ${{ steps.setup.outputs.python }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        AUTHOR: ${{ inputs.comment-author }}
      run: |
        set -uo pipefail
        report="$OUT/report"
        "$PY" -c 'import json,sys; json.dump({"body": open(sys.argv[1], encoding="utf-8").read()}, open(sys.argv[2], "w"))' \
          "$report/comment.md" "$report/comment-payload.json"
        if ! gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments" > "$report/comments.json"; then
          echo "::warning title=Exhibit A::could not list PR comments; summary is in the job summary"
          exit 0
        fi
        id="$("$PY" -m exhibit_a.ci.summary find-comment "$report/comments.json" --author "$AUTHOR")"
        rm -f "$report/comments.json"
        if [[ -n "$id" ]]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$id" --input "$report/comment-payload.json" > /dev/null \
            || echo "::warning title=Exhibit A::could not update the PR comment"
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$report/comment-payload.json" > /dev/null \
            || echo "::warning title=Exhibit A::could not create the PR comment"
        fi
        rm -f "$report/comment-payload.json"

    - name: Post verified fix suggestions
      if: always() && inputs.suggest-fixes == 'true' && steps.summary.outcome == 'success' && github.event.pull_request.number && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUT: ${{ steps.setup.outputs.out }}
        PY: ${{ steps.setup.outputs.python }}
        WORKDIR: ${{ steps.setup.outputs.workdir }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMIT_ID: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        diff_file="$OUT/report/pr.diff"
        base="${BASE_SHA:-$EVENT_BASE_SHA}"
        head="${HEAD_SHA:-$EVENT_HEAD_SHA}"
        git -C "$WORKDIR" diff --no-ext-diff --no-textconv "$base...$head" \
          -- > "$diff_file"
        "$PY" -m exhibit_a.ci.fixpr comments --run-dir "$OUT/run" --diff "$diff_file" --output "$OUT/report/fix-comments.json"
        "$PY" - "$OUT/report/fix-comments.json" "$COMMIT_ID" "$OUT/report/fix-review.json" <<'PY'
        import json, sys
        comments = json.load(open(sys.argv[1], encoding="utf-8"))
        commit = sys.argv[2]
        review = []
        ordinary = []
        for comment in comments:
            if "path" in comment and "line" in comment:
                comment = {**comment, "commit_id": commit}
                review.append(comment)
            else:
                ordinary.append(comment)
        json.dump(review, open(sys.argv[3], "w"), indent=2)
        json.dump(ordinary, open(sys.argv[3] + ".ordinary", "w"), indent=2)
        PY
        write_discussion() {
          local response="$1"
          [[ -s "$OUT/report/discussion-url.txt" ]] && return 0
          "$PY" - "$response" "$REPO" "$PR_NUMBER" "$OUT/report/discussion-url.txt" <<'PY'
        import json, re, sys
        from pathlib import Path
        raw, repo, pr, dest = sys.argv[1:]
        try:
            data = json.loads(Path(raw).read_text(encoding="utf-8"))
        except (OSError, ValueError, UnicodeDecodeError):
            raise SystemExit(0)
        url = data.get("html_url") if isinstance(data, dict) else None
        if not isinstance(url, str) or len(url) > 500:
            raise SystemExit(0)
        owner_repo = re.escape(repo)
        n = re.escape(pr)
        pattern = (
            rf"^https://github\.com/{owner_repo}/(pull|issues)/{n}"
            rf"#(discussion_r|pullrequestreview-|issuecomment-)\d+$"
        )
        if re.match(pattern, url):
            Path(dest).write_text(url + "\n", encoding="utf-8")
        PY
        }
        while IFS= read -r payload; do
          [[ -z "$payload" ]] && continue
          printf '%s\n' "$payload" > "$OUT/report/fix-comment.json"
          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/comments" --input "$OUT/report/fix-comment.json" \
            > "$OUT/report/fix-comment-response.json"
          write_discussion "$OUT/report/fix-comment-response.json"
        done < <("$PY" -c 'import json,sys; [print(json.dumps(x)) for x in json.load(open(sys.argv[1]))]' "$OUT/report/fix-review.json")
        while IFS= read -r payload; do
          [[ -z "$payload" ]] && continue
          printf '%s\n' "$payload" > "$OUT/report/fix-comment.json"
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$OUT/report/fix-comment.json" \
            > "$OUT/report/fix-comment-response.json"
          write_discussion "$OUT/report/fix-comment-response.json"
        done < <("$PY" -c 'import json,sys; [print(json.dumps({"body": x["body"]})) for x in json.load(open(sys.argv[1]))]' "$OUT/report/fix-review.json.ordinary")
        rm -f "$OUT/report/fix-comment.json" "$OUT/report/fix-comment-response.json"

    - name: Open verified fix PR
      if: always() && inputs.open-fix-pr == 'true' && steps.summary.outcome == 'success' && github.event.pull_request.number && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUT: ${{ steps.setup.outputs.out }}
        PY: ${{ steps.setup.outputs.python }}
        WORKDIR: ${{ steps.setup.outputs.workdir }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      run: |
        set -euo pipefail
        "$PY" -m exhibit_a.ci.fixpr branch --run-dir "$OUT/run" --output "$OUT/report/fix-branch.json"
        branch="$("$PY" -c 'import json,re,sys; d=json.load(open(sys.argv[1])); print("exhibit-a/fix-" + sys.argv[2] + "-" + re.sub(r"[^A-Za-z0-9._-]+", "-", d["test_path"].split("/")[-1][5:-3])[:40])' "$OUT/report/fix-branch.json" "$PR_NUMBER")"
        git -C "$WORKDIR" switch -c "$branch"
        "$PY" - "$OUT/report/fix-branch.json" "$WORKDIR" <<'PY'
        import json, pathlib, sys
        data = json.load(open(sys.argv[1], encoding="utf-8"))
        root = pathlib.Path(sys.argv[2])
        for item in data["files"]:
            target = root / item["path"]
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_text(item["content"], encoding="utf-8")
        PY
        git -C "$WORKDIR" apply --index "$WORKDIR/fix.patch"
        git -C "$WORKDIR" add tests/exhibit_a
        git -C "$WORKDIR" commit -m "Apply verified Exhibit A fix"
        git -C "$WORKDIR" push origin "$branch"
        gh pr create --repo "$REPO" --base "$BASE_BRANCH" --head "$branch" \
          --title "Apply verified Exhibit A fix for PR #$PR_NUMBER" \
          --body-file "$OUT/report/summary.md"

    - name: Generate SARIF report
      id: sarif
      if: always() && inputs.sarif == 'true' && steps.summary.outcome == 'success'
      shell: bash
      env:
        OUT: ${{ steps.setup.outputs.out }}
        PY: ${{ steps.setup.outputs.python }}
      run: |
        set -uo pipefail
        "$PY" -m exhibit_a.cli sarif --out-dir "$OUT/run" --output "$OUT/report/results.sarif"
        cp "$OUT/report/results.sarif" results.sarif 2>/dev/null || true

    - name: Upload SARIF to GitHub Code Scanning
      if: always() && inputs.sarif == 'true' && steps.sarif.outcome == 'success'
      # github/codeql-action/upload-sarif v3.28.10
      uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d
      with:
        sarif_file: results.sarif
        category: exhibit-a

    - name: Assemble ledger artifact
      if: always() && steps.summary.outcome == 'success'
      shell: bash
      env:
        OUT: ${{ steps.setup.outputs.out }}
        PY: ${{ steps.setup.outputs.python }}
        IN_PROVIDER: ${{ inputs.provider }}
        IN_MODEL: ${{ inputs.model }}
        IN_BUDGET: ${{ inputs.budget-usd }}
        IN_BASE_SHA: ${{ inputs.base-sha }}
        EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        "$PY" - "$OUT/run" "$OUT/report" "$IN_PROVIDER" "$IN_MODEL" "$IN_BUDGET" "$IN_BASE_SHA" "$EVENT_BASE_SHA" <<'PY'
        import json
        import shutil
        import sys
        from pathlib import Path

        run_dir = Path(sys.argv[1])
        report = Path(sys.argv[2])
        provider = sys.argv[3]
        model_input = sys.argv[4]
        budget_raw = sys.argv[5] if len(sys.argv) > 5 else ""
        base_sha = (sys.argv[6] if len(sys.argv) > 6 else "") or (sys.argv[7] if len(sys.argv) > 7 else "")
        ROLES = ("adversary", "test_writer", "fixer", "defender")
        EXPLOITS = ("test_exploit.py", "test_exploit.js", "test_exploit.ts")
        GRAPH_STATUSES = ("sliced", "nothing_reachable", "not_applicable", "no_suspicions")

        def as_int(value):
            try:
                number = int(value)
            except (TypeError, ValueError):
                return 0
            return number if number >= 0 else 0

        def as_float(value):
            try:
                number = float(value)
            except (TypeError, ValueError):
                return 0.0
            return number if number >= 0 else 0.0

        def as_text(value, limit=300):
            if not isinstance(value, str):
                return ""
            cleaned = " ".join(value.split())
            return cleaned[:limit]

        result_path = report / "result.json"
        try:
            result = json.loads(result_path.read_text(encoding="utf-8"))
        except (OSError, ValueError, UnicodeDecodeError):
            result = {}
        if not isinstance(result, dict):
            result = {}

        packages = []
        findings = result.get("findings") if isinstance(result.get("findings"), list) else []
        if findings and isinstance(findings[0], dict):
            rel = findings[0].get("package")
            rel_path = Path(rel) if isinstance(rel, str) else None
            if (
                rel_path is not None
                and rel
                and not rel_path.is_absolute()
                and ".." not in rel_path.parts
            ):
                first = run_dir / rel_path
                try:
                    first.resolve().relative_to(run_dir.resolve())
                except (OSError, ValueError):
                    first = None
                if first is not None and first.is_dir():
                    packages.append(first)
        pkg_root = run_dir / "packages"
        if pkg_root.is_dir():
            packages.extend(sorted(p for p in pkg_root.iterdir() if p.is_dir() and p not in packages))

        copied_patch = False
        copied_tests = set()
        for pkg in packages:
            if not copied_patch:
                src = pkg / "fix.patch"
                if src.is_file() and not src.is_symlink():
                    shutil.copyfile(src, report / "fix.patch")
                    copied_patch = True
            for name in EXPLOITS:
                if name in copied_tests:
                    continue
                src = pkg / name
                if src.is_file() and not src.is_symlink():
                    shutil.copyfile(src, report / name)
                    copied_tests.add(name)

        by_role = {
            role: {"tokens_in": 0, "tokens_out": 0, "cost_usd": 0.0, "events": 0, "models": []}
            for role in ROLES
        }
        models = []
        scan_payloads = []
        ledger_path = report / "ledger.jsonl"
        if not ledger_path.is_file():
            ledger_path = run_dir / "ledger.jsonl"
        if ledger_path.is_file():
            try:
                lines = ledger_path.read_text(encoding="utf-8").splitlines()
            except (OSError, UnicodeDecodeError):
                lines = []
            for raw in lines:
                if not raw.strip():
                    continue
                try:
                    event = json.loads(raw)
                except ValueError:
                    continue
                if not isinstance(event, dict):
                    continue
                role = event.get("role") if isinstance(event.get("role"), str) else ""
                if role in by_role:
                    bucket = by_role[role]
                    bucket["tokens_in"] += as_int(event.get("tokens_in"))
                    bucket["tokens_out"] += as_int(event.get("tokens_out"))
                    bucket["cost_usd"] = round(bucket["cost_usd"] + as_float(event.get("cost_usd")), 6)
                    bucket["events"] += 1
                    name = as_text(event.get("model"), 120)
                    if name and name not in bucket["models"]:
                        bucket["models"].append(name)
                    if name and name not in models:
                        models.append(name)
                if event.get("type") == "scan_done" and isinstance(event.get("payload"), dict):
                    scan_payloads.append(event["payload"])

        by_role = {role: bucket for role, bucket in by_role.items() if bucket["events"]}

        def graph_score(payload):
            status = payload.get("status") if isinstance(payload.get("status"), str) else ""
            if status == "sliced" or isinstance(payload.get("paths"), list) and payload.get("paths"):
                return 3
            if status == "nothing_reachable" or isinstance(payload.get("graph"), dict):
                return 2
            if status in GRAPH_STATUSES:
                return 1
            return 0

        graph_summary = None
        usable = [p for p in scan_payloads if graph_score(p) > 0]
        if usable:
            payload = max(usable, key=graph_score)
            graph_obj = payload.get("graph") if isinstance(payload.get("graph"), dict) else {}
            stats = graph_obj.get("stats") if isinstance(graph_obj.get("stats"), dict) else graph_obj
            if not isinstance(stats, dict):
                stats = {}
            stats = {
                key: as_int(stats.get(key))
                for key in ("files", "nodes", "edges", "resolved", "external", "unresolved")
                if key in stats
            }
            paths = []
            raw_paths = payload.get("paths") if isinstance(payload.get("paths"), list) else []
            for item in raw_paths[:32]:
                if not isinstance(item, dict):
                    continue
                paths.append({
                    "path": as_text(item.get("path"), 500),
                    "entry_point": as_text(item.get("entry_point"), 200),
                    "entry_kind": as_text(item.get("entry_kind"), 64),
                    "changed": as_text(item.get("changed"), 200),
                    "vuln_class": as_text(item.get("vuln_class"), 120),
                    "confidence": as_text(item.get("confidence"), 32),
                })
            entries = payload.get("entries") if isinstance(payload.get("entries"), list) else []
            entry_names = []
            for item in entries[:32]:
                if isinstance(item, str):
                    entry_names.append(as_text(item, 200))
                elif isinstance(item, dict):
                    name = as_text(item.get("name") or item.get("oracle_name"), 200)
                    if name:
                        entry_names.append(name)
            if not entry_names:
                for item in paths:
                    name = item.get("entry_point") or ""
                    if name and name not in entry_names:
                        entry_names.append(name)
            changed = []
            for item in (payload.get("changed") if isinstance(payload.get("changed"), list) else [])[:32]:
                if isinstance(item, str):
                    changed.append(as_text(item, 200))
            other_sinks = payload.get("paths_to_other_sinks")
            graph_summary = {
                "schema_version": "1",
                "available": True,
                "status": as_text(payload.get("status"), 64),
                "effect": as_text(payload.get("effect"), 64),
                "reason": as_text(payload.get("reason"), 500),
                "stats": stats,
                "build_seconds": as_float(payload["build_seconds"]) if "build_seconds" in payload else None,
                "entries": entry_names,
                "changed": changed,
                "paths": paths,
                "paths_to_other_sinks": as_int(other_sinks) if other_sinks is not None else None,
                "source_file": as_text(payload.get("source_file"), 300),
            }
            (report / "graph-summary.json").write_text(
                json.dumps(graph_summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
            )

        discussion = ""
        discussion_path = report / "discussion-url.txt"
        if discussion_path.is_file():
            try:
                discussion = discussion_path.read_text(encoding="utf-8").strip().splitlines()[0]
            except (OSError, UnicodeDecodeError, IndexError):
                discussion = ""
            if len(discussion) > 500:
                discussion = ""

        result["provider"] = as_text(provider, 120)
        result["model"] = as_text(model_input, 120) or (models[0] if models else "")
        result["tokens_by_role"] = by_role
        result["discussion_url"] = discussion
        result["graph_summary"] = graph_summary
        try:
            result["budget_usd"] = float(budget_raw) if str(budget_raw).strip() else None
        except ValueError:
            result["budget_usd"] = None
        result["base_sha"] = as_text(base_sha, 64)
        result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        PY

    - name: Upload ledger artifact
      if: always() && steps.summary.outcome == 'success'
      # actions/upload-artifact v7.0.2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.setup.outputs.out }}/report/ledger.jsonl
          ${{ steps.setup.outputs.out }}/report/result.json
          ${{ steps.setup.outputs.out }}/report/summary.md
          ${{ steps.setup.outputs.out }}/report/results.sarif
          ${{ steps.setup.outputs.out }}/report/fix.patch
          ${{ steps.setup.outputs.out }}/report/test_exploit.py
          ${{ steps.setup.outputs.out }}/report/test_exploit.js
          ${{ steps.setup.outputs.out }}/report/test_exploit.ts
          ${{ steps.setup.outputs.out }}/report/graph-summary.json
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}
        include-hidden-files: false

    - name: Gate on proven findings
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.summary.outputs.exit-code }}
        STATUS: ${{ steps.summary.outputs.status }}
        PROVEN: ${{ steps.summary.outputs.proven }}
      run: |
        if [[ -z "$EXIT_CODE" ]]; then
          echo "::error title=Exhibit A::no result was produced (see earlier steps)"
          exit 1
        fi
        # not_run is never a passing default: without verdicts nothing was
        # verified, so the check fails even when fail-on is 'never'.
        if [[ "$STATUS" == "not_run" ]]; then
          echo "::error title=Exhibit A::the engine produced no verdicts (status not_run); nothing was verified"
          exit 1
        fi
        if [[ "$EXIT_CODE" != "0" ]]; then
          echo "::error title=Exhibit A::$PROVEN proven finding(s); see the job summary and the ledger artifact"
          exit 1
        fi
        echo "Exhibit A status: $STATUS. Nothing could be proven (this is not a claim that the change is secure)."
