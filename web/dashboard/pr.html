<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exhibit A · Pull request analysis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="dashboard.css">
<script src="views/viz.js"></script>
<script src="views/netgraph.js"></script>
<script src="views/graphdata.js"></script>
<script src="dc-lite.js"></script>
<script src="views/prdata.js"></script>
<script src="views/pr.js"></script>
<script src="views/palette.js"></script>
</head>
<body>
<template data-dc>
<div class="xa">
  <div class="blob" aria-hidden="true" data-style="width: 760px; height: 760px; left: -200px; top: -260px; background: #2c4fc4; opacity: .38"></div>
  <div class="blob" aria-hidden="true" data-style="width: 620px; height: 620px; right: -160px; top: 10%; background: #9aa3e0; opacity: .55"></div>
  <div class="blob" aria-hidden="true" data-style="width: 700px; height: 700px; left: 25%; top: 45%; background: #4b3fa0; opacity: .2"></div>
  <div class="blob" aria-hidden="true" data-style="width: 520px; height: 520px; right: 10%; bottom: -200px; background: #d9b98f; opacity: .35"></div>

  <div class="frame">

    <nav class="side" data-nomap aria-label="Main" data-style="padding: 24px 14px; display: flex; flex-direction: column; gap: 28px">
      <pre class="mono" aria-label="Exhibit A" data-style="padding: 0 10px; font-size: 9.5px; line-height: 1.2; color: #ffffff">╔═╗═╗ ╦╦ ╦╦╔╗ ╦╔╦╗  ╔═╗
║╣ ╔╩╦╝╠═╣║╠╩╗║ ║   ╠═╣
╚═╝╩ ╚═╩ ╩╩╚═╝╩ ╩   ╩ ╩</pre>
      <div data-style="display: flex; flex-direction: column; gap: 2px">
        <a class="nav-a" href="index.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>Overview</a>
        <a class="nav-a nav-on" href="prs.html" aria-current="page"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4M13 3.5 10.5 6 13 8.5"></path></svg>Pull requests</a>
        <a class="nav-a" href="findings.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6L12 3Z"></path><path d="m8.8 12 2.2 2.2 4.3-4.4"></path></svg>Findings</a>
        <a class="nav-a" href="graph.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="5" cy="12" r="2.3"></circle><circle cx="18" cy="5.5" r="2.3"></circle><circle cx="18" cy="18.5" r="2.3"></circle><path d="m7.1 11 8.8-4.4M7.1 13l8.8 4.4"></path></svg>Code graph</a>
        <a class="nav-a" href="benchmark.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Benchmark</a>
        <a class="nav-a" href="economics.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Economics</a>
      </div>
      <div class="mono" data-style="margin-top: auto; padding: 16px 12px 0; border-top: 1px solid rgba(255,255,255,.14); font-size: 11px; color: rgba(232,238,251,.75)">Diego-do-na/Exhibit-A · main</div>
      <button type="button" class="theme-t pal-open" data-open-palette aria-label="Open search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span>Search</span><span class="pal-kbd">⌘K</span></button>
      <button type="button" class="theme-t" data-theme-toggle aria-label="Toggle night mode"><svg class="ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"></path></svg><svg class="ico-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><span class="t-night">Night mode</span><span class="t-day">Day mode</span></button>
    </nav>

    <div class="scroll"><main class="content">

      <header data-style="padding: 12px 4px 0; display: flex; flex-direction: column; gap: 14px">
        <div data-style="display: flex; align-items: center; gap: 10px; font-size: 14px"><a href="prs.html" data-style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Pull requests</a><span data-style="color: #45587c">/</span><span class="mono" data-style="font-size: 13px; color: #3d4b68">{{pr.crumb}}</span></div>
        <div data-style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between">
          <div data-style="min-width: 0">
            <h1 class="dsp" data-style="margin: 0; font-size: 54px; font-weight: 500; line-height: 1.05; letter-spacing: -.035em">{{pr.title}}</h1>
            <div class="mono" data-style="margin-top: 12px; font-size: 13px; color: #3d4b68">{{pr.meta}}</div>
          </div>
          <div class="state {{st.cls}}" role="status" data-style="background: {{st.bg}}; color: {{st.fg}}; border-color: {{st.bd}}"><span class="state-i"><sc-if value="{{st.isOpen}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.4"></circle><circle cx="6" cy="18" r="2.4"></circle><circle cx="18" cy="18" r="2.4"></circle><path d="M6 8.4v7.2M18 15.6V10a3 3 0 0 0-3-3h-3m0 0 2.2-2.2M12 7l2.2 2.2"></path></svg></sc-if><sc-if value="{{st.isDone}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12.5 2.7 2.7L16 9.5"></path></svg></sc-if><sc-if value="{{st.isBusy}}"><svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if></span><span><span class="state-l">{{st.l}}</span><span class="state-s">{{st.s}}</span></span></div>
        </div>
        <p class="lead" data-style="margin-top: 4px">{{pr.lead}}</p>
        <sc-if value="{{mode.isDemo}}"><div><span data-style="display: inline-flex; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(165,112,63,.45); background: rgba(165,112,63,.12); color: #7d5229; font-size: 13px; font-weight: 600">Recorded demo · simulated</span></div></sc-if>
      </header>

      <sc-if value="{{mode.isAnalysis}}">
      <section data-style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px">
        <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
          <span class="lbl">Risk level</span>
          <span class="dsp" data-style="font-size: 44px; font-weight: 500; letter-spacing: -.03em; line-height: 1; color: {{risk.c}}">{{risk.l}}</span>
          <div data-style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px"><sc-for list="{{risk.bars}}" as="b"><div data-style="height: 6px; background: {{b.c}}"></div></sc-for></div>
          <span data-style="font-size: 14px; color: #3d4b68; line-height: 1.45">{{risk.d}}</span>
        </div>
        <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
          <span class="lbl">Verdict</span>
          <span class="dsp" data-style="font-size: 44px; font-weight: 500; letter-spacing: -.03em; line-height: 1">{{verdict.l}}</span>
          <span data-style="font-size: 14px; color: #3d4b68; line-height: 1.45">{{verdict.d}}</span>
        </div>
        <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
          <span class="lbl">Change</span>
          <span class="dsp" data-style="font-size: 44px; font-weight: 500; letter-spacing: -.03em; line-height: 1">1 file</span>
          <span class="mono" data-style="font-size: 14px"><span data-style="color: #2c4fc4">+2</span>  <span data-style="color: #a5703f">−6</span>  · pamphlets.py</span>
        </div>
        <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
          <span class="lbl">Merge</span>
          <span class="dsp" data-style="font-size: 44px; font-weight: 500; letter-spacing: -.03em; line-height: 1">{{merge.l}}</span>
          <span data-style="font-size: 14px; color: #3d4b68; line-height: 1.45">{{merge.d}}</span>
        </div>
      </section>

      <section class="card" data-style="padding: 20px 22px; display: flex; flex-direction: column; gap: 14px">
        <div data-style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><span class="lbl" data-style="min-width: 150px">MITRE ATT&amp;CK</span><sc-for list="{{attack}}" as="t"><button type="button" class="tag" data-ev-click="{{t.open}}" aria-label="{{t.aria}}"><span class="tag-id">{{t.id}}</span><span class="tag-n">{{t.name}}</span></button></sc-for></div>
        <div data-style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><span class="lbl" data-style="min-width: 150px">Weakness</span><sc-for list="{{weak}}" as="t"><button type="button" class="tag" data-ev-click="{{t.open}}" aria-label="{{t.aria}}"><span class="tag-id">{{t.id}}</span><span class="tag-n">{{t.name}}</span></button></sc-for></div>
      </section>

      <section data-style="display: flex; flex-direction: column; gap: 22px">
        <div class="sec-h"><span class="sec-n">01</span><div><h2 class="sec-t">Live analysis</h2><p class="lead">Each stage runs for real; a change is exploitable only once the oracle sees the effect in every run.</p></div></div>
        <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 18px">
          <div data-style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
            <div data-style="display: flex; align-items: center; gap: 14px">
              <span class="{{live.dotCls}}" data-style="width: 10px; height: 10px; border-radius: 50%; background: {{live.dot}}"></span>
              <span class="dsp" data-style="font-size: 18px; font-weight: 500">{{live.title}}</span>
              <span class="mono" data-style="font-size: 13px; color: #3d4b68">{{live.clock}}</span>
            </div>
            <div data-style="display: flex; gap: 8px; align-items: center">
              <button type="button" class="ib" aria-label="{{live.playL}}" data-ev-click="{{live.toggle}}"><sc-if value="{{live.playing}}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></sc-if><sc-if value="{{live.paused}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg></sc-if></button>
              <button type="button" class="ib" aria-label="Replay" data-ev-click="{{live.replay}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
              <div class="seg" role="group" aria-label="Speed"><sc-for list="{{live.speeds}}" as="o"><button type="button" class="{{o.cls}}" data-ev-click="{{o.pick}}">{{o.l}}</button></sc-for></div>
            </div>
          </div>
          <div data-style="height: 4px; background: rgba(13,27,62,.08)"><div data-style="height: 100%; width: {{live.pct}}%; background: #2c4fc4; transition: width .4s"></div></div>
          <sc-if value="{{live.scrub}}" hint-placeholder-val="{{ false }}">
            <div class="scrub">
              <span class="mono" data-style="font-size: 12px; color: #3d4b68">Scrub the ledger</span>
              <input type="range" min="0" max="{{live.scrub.max}}" value="{{live.scrub.val}}" data-ev-change="{{live.scrub.onScrub}}" aria-label="Scrub the ledger timeline">
              <span class="scrub-now">{{live.scrub.label}}</span>
            </div>
          </sc-if>
          <div data-style="display: flex; flex-wrap: wrap; gap: 20px">
            <ol data-style="flex: 1 1 280px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
              <sc-for list="{{live.stages}}" as="s">
                <li data-style="display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; border-top: 1px solid rgba(13,27,62,.07); opacity: {{s.op}}">
                  <span class="{{s.cls}}" data-style="width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{s.bg}}; color: #ffffff; border: 1.5px solid {{s.bd}}"><sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if></span>
                  <span data-style="font-size: 15px; font-weight: {{s.fw}}">{{s.n}}</span>
                  <span class="mono" data-style="font-size: 11px; color: #4a5873">{{s.k}}</span>
                </li>
              </sc-for>
            </ol>
            <div data-nomap data-style="flex: 2 1 420px; min-width: 0; border-radius: 4px; background: linear-gradient(160deg, rgba(10,24,64,.95), rgba(22,48,122,.9)); padding: 18px 20px; min-height: 520px; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,.12)">
              <div class="mono" data-style="font-size: 11px; color: rgba(232,238,251,.6); padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 8px">{{live.src}}</div>
              <sc-for list="{{live.log}}" as="l">
                <div class="mono" data-style="display: grid; grid-template-columns: 58px 96px minmax(0, 1fr); gap: 10px; font-size: 12.5px; line-height: 1.6; padding: 5px 0; color: #e6ecfa">
                  <span data-style="color: rgba(232,238,251,.55)">{{l.t}}</span>
                  <span data-style="color: {{l.rc}}">{{l.r}}</span>
                  <span data-style="color: {{l.mc}}">{{l.m}}</span>
                </div>
              </sc-for>
              <sc-if value="{{live.running}}" hint-placeholder-val="{{ true }}"><div class="mono" data-style="font-size: 12.5px; color: #9aa3e0; padding: 5px 0">{{live.next}} <span class="caret">▍</span></div></sc-if>
            </div>
          </div>
          <div data-style="display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 18px; padding: 20px 22px; border-radius: 4px; background: {{dec.bg}}; border: 1px solid {{dec.bd}}">
            <span data-style="background: {{dec.c}}; border-radius: 3px"></span>
            <div>
              <div class="lbl" data-style="color: {{dec.c}}">Decision</div>
              <div class="dsp" data-style="font-size: 26px; font-weight: 500; letter-spacing: -.02em; margin-top: 6px">{{dec.t}}</div>
              <p data-style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #26365a">{{dec.d}}</p>
            </div>
          </div>
        </div>
        <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 4px">
          <h3 class="ct" data-style="margin-bottom: 8px">Proof standard</h3>
          <sc-for list="{{proof}}" as="p">
            <div data-style="display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid rgba(13,27,62,.07)">
              <span data-style="width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{p.bg}}; color: #ffffff; border: 1.5px solid {{p.bd}}"><sc-if value="{{p.ok}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if></span>
              <div><div data-style="font-size: 15px; font-weight: 500">{{p.n}}</div><div data-style="font-size: 14px; color: #3d4b68; margin-top: 2px">{{p.d}}</div></div>
              <span class="mono" data-style="font-size: 12px; color: {{p.sc}}">{{p.s}}</span>
            </div>
          </sc-for>
        </div>
      </section>

      <section data-style="display: flex; flex-direction: column; gap: 22px">
        <div class="sec-h"><span class="sec-n">02</span><div><h2 class="sec-t">What the pull request changes</h2><p class="lead">Six lines of protection become one: a name like ../outside/canary.txt walks out of the shelf.</p></div></div>
        <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 14px">
          <div data-style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><span class="mono" data-style="font-size: 14px">examples/action-demo/pamphlets.py</span><span class="mono" data-style="font-size: 13px"><span data-style="color: #2c4fc4">+2</span>  <span data-style="color: #a5703f">−6</span></span></div>
          <div class="code">
            <sc-for list="{{prDiff}}" as="r">
              <div class="cl" data-style="background: {{r.bg}}">
                <span class="gut">{{r.o}}</span><span class="gut">{{r.n}}</span><span data-style="color: {{r.sc}}; text-align: center">{{r.s}}</span><span data-style="color: {{r.tc}}">{{r.t}}</span>
                <sc-if value="{{r.vuln}}" hint-placeholder-val="{{ false }}"><span data-style="font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 3px; background: #b23a3a; color: #ffffff">vulnerable · CWE-22</span></sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </section>

      <section data-style="display: flex; flex-direction: column; gap: 22px">
        <div class="sec-h"><span class="sec-n">03</span><div><h2 class="sec-t">Blast radius</h2><p class="lead">The full code graph, with the possibly damaged route for this pull request marked in red so its impact is visible in context. Path view: the route itself, step by step.</p></div></div>
        <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 18px">
          <div data-style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 13px; color: #3d4b68">
            <span data-style="display: inline-flex; align-items: center; gap: 8px"><svg width="34" height="8" aria-hidden="true"><path d="M0 4h34" stroke="#a5703f" stroke-width="2.4" stroke-dasharray="8 6"></path></svg>Path the exploit follows</span>
            <span data-style="display: inline-flex; align-items: center; gap: 8px"><svg width="34" height="8" aria-hidden="true"><path d="M0 4h34" stroke="#7a86a1" stroke-width="1.4" stroke-opacity=".6"></path></svg>Other calls, not affected</span>
            <span data-style="display: inline-flex; align-items: center; gap: 8px"><svg width="34" height="8" aria-hidden="true"><path d="M0 4h34" stroke="#7a86a1" stroke-width="1.4" stroke-dasharray="5 5"></path></svg>Would inherit the problem</span>
            <span data-style="display: inline-flex; align-items: center; gap: 8px"><svg width="34" height="8" aria-hidden="true"><path d="M0 4h34" stroke="#ff6b6b" stroke-width="2.6"></path></svg>Connection the exploit reaches</span>
            <div class="seg" role="group" aria-label="Blast radius view" data-style="margin-left: auto"><sc-for list="{{bvOpts}}" as="o"><button type="button" class="{{o.cls}}" data-ev-click="{{o.pick}}">{{o.l}}</button></sc-for></div>
          </div>
          <div id="blastnet" class="net" data-keep role="group" aria-label="Network of the code the exploit reaches" data-style="display: {{bNet}}; min-height: 480px"></div>
          <div id="blast" class="gv" data-keep role="group" aria-label="Dependency graph of the affected path" data-style="display: {{bPath}}; min-height: 460px; border-radius: 4px; border: 1px solid rgba(13,27,62,.08); background-color: rgba(255,255,255,.35); background-image: radial-gradient(rgba(13,27,62,.18) 1px, transparent 1.2px); background-size: 22px 22px"></div>
        </div>
      </section>

      <sc-if value="{{showFixSection}}">
      <section data-style="display: flex; flex-direction: column; gap: 22px">
        <div class="sec-h"><span class="sec-n">04</span><div><h2 class="sec-t">{{fx.title}}</h2><p class="lead">{{fx.lead}}</p></div></div>

        <sc-if value="{{fx.pending}}" hint-placeholder-val="{{ true }}">
          <div data-style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
            <div class="card" data-style="flex: 3 1 560px; min-width: 0; padding: 22px; display: flex; flex-direction: column; gap: 14px">
              <div data-style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><span class="mono" data-style="font-size: 14px">fix.patch · pamphlets.py</span><span class="mono" data-style="font-size: 13px"><span data-style="color: #2c4fc4">+6</span>  <span data-style="color: #a5703f">−2</span></span></div>
              <div class="code">
                <sc-for list="{{fixDiff}}" as="r">
                  <div class="cl" data-style="background: {{r.bg}}"><span class="gut">{{r.o}}</span><span class="gut">{{r.n}}</span><span data-style="color: {{r.sc}}; text-align: center">{{r.s}}</span><span data-style="color: {{r.tc}}">{{r.t}}</span><span></span></div>
                </sc-for>
              </div>
            </div>
            <div class="card" data-style="flex: 2 1 340px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px">
              <h3 class="ct">Already verified in the sandbox</h3>
              <sc-for list="{{expect}}" as="e">
                <div data-style="display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start">
                  <span data-style="width: 20px; height: 20px; border-radius: 50%; background: #2c4fc4; color: #ffffff; display: flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
                  <span data-style="font-size: 15px; line-height: 1.5; color: #26365a">{{e}}</span>
                </div>
              </sc-for>
              <button type="button" class="btn btn-p" data-ev-click="{{askApprove}}" data-style="margin-top: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Apply suggested fix (simulated)</button>
              <span data-style="font-size: 13px; color: #3d4b68; text-align: center">Suggested fix posted as a review suggestion; the author applies it with Commit suggestion</span>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{fx.committing}}" hint-placeholder-val="{{ false }}">
          <div class="card" data-style="padding: 24px; display: flex; flex-direction: column; gap: 4px">
            <sc-for list="{{commitSteps}}" as="c">
              <div data-style="display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 14px; align-items: center; min-height: 52px; border-top: 1px solid rgba(13,27,62,.07); opacity: {{c.op}}">
                <span class="{{c.cls}}" data-style="width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{c.bg}}; color: #ffffff; border: 1.5px solid {{c.bd}}"><sc-if value="{{c.done}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if></span>
                <span data-style="font-size: 16px">{{c.l}}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{fx.approved}}" hint-placeholder-val="{{ false }}">
          <div data-style="display: flex; flex-direction: column; gap: 20px">
            <div class="card" data-style="padding: 22px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center">
              <span data-style="width: 44px; height: 44px; border-radius: 50%; background: #2c4fc4; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
              <div data-style="flex: 1 1 300px; min-width: 0"><div class="mono" data-style="font-size: 15px">fix: confine pamphlet names to the shelf directory</div><div data-style="font-size: 14px; color: #3d4b68; margin-top: 4px">review suggestion on nested-pamphlets · 1 file · +6 −2 · applied by the author with Commit suggestion</div></div>
              <button type="button" class="btn btn-s" data-ev-click="{{reset}}">Reset demo</button>
            </div>
            <div class="card" data-style="padding: 8px 22px 14px; overflow-x: auto">
              <div data-style="min-width: 560px" role="table" aria-label="Before and after the fix">
                <div class="lbl" role="row" data-style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 14px 0; font-size: 11px"><span role="columnheader">Measure</span><span role="columnheader">Before the fix</span><span role="columnheader">After the fix</span></div>
                <sc-for list="{{after}}" as="a">
                  <div role="row" data-style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 14px 0; border-top: 1px solid rgba(13,27,62,.08)"><span role="cell" data-style="font-size: 15px">{{a.m}}</span><span role="cell" class="mono" data-style="font-size: 13px; color: #a5703f">{{a.b}}</span><span role="cell" class="mono" data-style="font-size: 13px; color: #2c4fc4">{{a.a}}</span></div>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-if>
      </section>
      </sc-if>

      <sc-if value="{{whyPanel}}">
        <section data-style="display: flex; flex-direction: column; gap: 22px">
          <div class="sec-h"><span class="sec-n">04</span><div><h2 class="sec-t">Why it was not reported</h2><p class="lead">{{whyPanel.title}}.</p></div></div>
          <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 10px">
            <span class="mono" data-style="font-size: 13px; color: #a5703f">{{whyPanel.kind}}</span>
            <p data-style="margin: 0; font-size: 16px; line-height: 1.65; color: #26365a">{{whyPanel.reason}}</p>
            <span class="mono" data-style="font-size: 13px; color: #3d4b68">{{whyPanel.where}}</span>
            <p data-style="margin: 0; font-size: 14px; line-height: 1.6; color: #3d4b68">No fix is proposed and nothing is approved when the oracle did not observe the effect. Green would mean nothing could be proven, never safe.</p>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{safe.show}}" hint-placeholder-val="{{ false }}">
        <section id="why-safe" data-style="display: flex; flex-direction: column; gap: 22px; padding-bottom: 20px">
          <div class="sec-h"><span class="sec-n">05</span><div><h2 class="sec-t">Why nothing could be proven</h2><p class="lead">Green is not safe: it means {{safe.headline}}. Every suspicion below was tested in the isolated sandbox and refused for a recorded reason.</p></div></div>
          <div data-style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px">
            <div class="card" data-style="padding: 20px 22px"><span class="lbl">Suspicions raised</span><div class="dsp" data-style="font-size: 44px; font-weight: 500">{{safe.suspicions}}</div></div>
            <div class="card" data-style="padding: 20px 22px"><span class="lbl">Exploit tests written</span><div class="dsp" data-style="font-size: 44px; font-weight: 500">{{safe.exploits}}</div></div>
            <div class="card" data-style="padding: 20px 22px"><span class="lbl">Dropped for lack of proof</span><div class="dsp" data-style="font-size: 44px; font-weight: 500">{{safe.dropped}}</div></div>
          </div>
          <div class="card" data-style="padding: 8px 22px 14px">
            <sc-for list="{{safe.items}}" as="w">
              <div data-style="display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid rgba(13,27,62,.08)">
                <div><div class="mono" data-style="font-size: 13px">{{w.id}}</div><div data-style="font-size: 13px; color: #3d4b68; margin-top: 4px">{{w.cls}} · {{w.verdict}}</div><div class="mono" data-style="font-size: 12px; color: #45587c; margin-top: 4px">{{w.where}}</div></div>
                <div data-style="font-size: 15px; line-height: 1.55; color: #26365a">{{w.reason}}</div>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-if>
      </sc-if>
      <sc-if value="{{mode.isPr}}">
        <section data-style="display: flex; flex-direction: column; gap: 22px; padding-bottom: 20px">
          <div class="sec-h"><span class="sec-n">01</span><div><h2 class="sec-t">Pull request</h2><p class="lead">{{pr.meta}}</p></div></div>
          <div data-style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
            <div class="card" data-style="padding: 20px 22px"><span class="lbl">State</span><div class="dsp" data-style="font-size: 34px; font-weight: 500">MERGED</div><span data-style="font-size: 14px; color: #3d4b68">{{pr.when}}</span></div>
            <div class="card" data-style="padding: 20px 22px"><span class="lbl">Author</span><div class="dsp" data-style="font-size: 34px; font-weight: 500">{{pr.author}}</div><span data-style="font-size: 14px; color: #3d4b68">{{pr.authorType}}</span></div>
            <div class="card" data-style="padding: 20px 22px"><span class="lbl">Change</span><div class="dsp" data-style="font-size: 34px; font-weight: 500">{{pr.files}} files</div><span class="mono" data-style="font-size: 13px; color: #3d4b68">+{{pr.added}} / −{{pr.removed}} · {{pr.commits}} commits</span></div>
            <div class="card" data-style="padding: 20px 22px"><span class="lbl">Area</span><div class="dsp" data-style="font-size: 34px; font-weight: 500">{{pr.areaShort}}</div><span data-style="font-size: 14px; color: #3d4b68">{{pr.testsLabel}} · cycle {{pr.cycle}} min</span></div>
          </div>
          <div class="card" data-style="padding: 22px">
            <div data-style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px">
              <sc-for list="{{pr.life}}" as="s">
                <div data-style="display: flex; gap: 12px; align-items: flex-start">
                  <span data-style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: {{s.bg}}; color: #ffffff; display: flex; align-items: center; justify-content: center"><sc-if value="{{s.done}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if><sc-if value="{{s.neutral}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14"></path></svg></sc-if></span>
                  <span><b data-style="display: block; font-size: 15px">{{s.l}}</b><span data-style="font-size: 13px; color: #3d4b68">{{s.d}}</span></span>
                </div>
              </sc-for>
            </div>
          </div>
          <div data-style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
            <sc-for list="{{pr.ctx}}" as="c">
              <div class="card" data-style="padding: 20px 22px; display: flex; flex-direction: column; gap: 8px">
                <span class="lbl">{{c.l}}</span>
                <span class="dsp" data-style="font-size: 28px; font-weight: 500">{{c.v}}</span>
                <span data-style="height: 8px; background: rgba(13,27,62,.08)"><span data-style="display: block; height: 8px; width: {{c.pct}}%; background: #2c4fc4"></span></span>
                <span data-style="font-size: 13px; color: #3d4b68">{{c.d}}</span>
              </div>
            </sc-for>
          </div>
          <div class="card" data-style="padding: 20px 22px; display: flex; flex-direction: column; gap: 12px">
            <h3 class="ct">Merges per day</h3>
            <div data-style="display: flex; gap: 10px; align-items: flex-end; min-height: 90px">
              <sc-for list="{{pr.days}}" as="d">
                <div data-style="flex: 1; display: flex; flex-direction: column; gap: 6px; align-items: center">
                  <span data-style="width: 100%; max-width: 44px; height: 64px; background: rgba(13,27,62,.06); display: flex; align-items: flex-end"><span data-style="display: block; width: 100%; height: {{d.h}}%; background: {{d.bar}}"></span></span>
                  <span class="mono" data-style="font-size: 12px; color: #3d4b68">{{d.d}} · {{d.n}}</span>
                </div>
              </sc-for>
            </div>
          </div>
          <div data-style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
            <div class="card" data-style="padding: 20px 22px; display: flex; flex-direction: column; gap: 8px">
              <h3 class="ct">Same area</h3>
              <sc-for list="{{pr.sameArea}}" as="r"><a href="{{r.href}}" data-style="display: flex; gap: 8px; align-items: center; text-decoration: none; padding: 6px 0"><span data-style="flex: none; width: 8px; height: 8px; background: {{r.c}}"></span><span class="mono" data-style="font-size: 12px">{{r.id}}</span><span data-style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span data-style="font-size: 11px; color: #45587c">{{r.ty}}</span></a></sc-for>
            </div>
            <div class="card" data-style="padding: 20px 22px; display: flex; flex-direction: column; gap: 8px">
              <h3 class="ct">More from this author</h3>
              <sc-for list="{{pr.sameAuthor}}" as="r"><a href="{{r.href}}" data-style="display: flex; gap: 8px; align-items: center; text-decoration: none; padding: 6px 0"><span data-style="flex: none; width: 8px; height: 8px; background: {{r.c}}"></span><span class="mono" data-style="font-size: 12px">{{r.id}}</span><span data-style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span data-style="font-size: 11px; color: #45587c">{{r.ty}}</span></a></sc-for>
            </div>
          </div>
          <div data-style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap">
            <sc-if value="{{pr.hasPrev}}"><a href="{{pr.prevPr.href}}">← {{pr.prevPr.id}} · earlier merge</a></sc-if>
            <sc-if value="{{pr.hasNext}}"><a href="{{pr.nextPr.href}}">{{pr.nextPr.id}} · later merge →</a></sc-if>
          </div>
          <div class="card" data-style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
            <h3 class="ct">Exhibit A check: not evaluated</h3>
            <p data-style="font-size: 15px; line-height: 1.6; color: #26365a">This pull request predates the Action or no run was recorded for it. Record one against the pull request diff, or open one of the runs that do exist.</p>
            <div class="mono" data-style="font-size: 13px; background: rgba(13,27,62,.06); border: 1px solid rgba(13,27,62,.1); border-radius: 4px; padding: 12px 14px">exhibit-a run --pr-diff BASE..HEAD</div>
            <div><a href="index.html">Runs that exist →</a></div>
          </div>
        </section>
      </sc-if>
    </main></div>
  </div>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
    <div class="ovl" role="dialog" aria-modal="true" aria-label="Confirm fix commit">
      <div class="modal" data-style="max-width: 560px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
        <span class="lbl">Confirm</span>
        <h2 class="dsp" data-style="margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -.02em">Commit the verified fix?</h2>
        <p data-style="margin: 0; font-size: 16px; line-height: 1.6; color: #26365a">Exhibit A posts the verified fix as a GitHub review suggestion (<span class="mono" data-style="font-size: 14px">suggest-fixes</span>) and a summary comment (<span class="mono" data-style="font-size: 14px">comment</span>); it never pushes. If you apply the suggestion here (simulated), GitHub creates the commit in your name, and the proof loop re-runs on the new head before the pull request can merge.</p>
        <div class="mono" data-style="font-size: 13px; padding: 12px 14px; border-radius: 4px; background: rgba(10,24,64,.05)">fix: confine pamphlet names to the shelf directory</div>
        <div data-style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap"><button type="button" class="btn btn-s" data-ev-click="{{cancel}}">Cancel</button><button type="button" class="btn btn-p" data-ev-click="{{doCommit}}">Confirm and commit</button></div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{tag.open}}" hint-placeholder-val="{{ false }}">
    <div class="ovl" role="dialog" aria-modal="true" aria-label="{{tag.name}}" data-ev-click="{{tag.close}}">
      <div class="modal" data-ev-click="{{stop}}">
        <div data-style="display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid rgba(13,27,62,.1)">
          <span class="mono" data-style="font-size: 13px; padding: 4px 10px; border-radius: 3px; border: 1px solid rgba(13,27,62,.18); color: #2c4fc4">{{tag.id}}</span>
          <span class="lbl">{{tag.cat}}</span>
          <button type="button" class="ib" aria-label="Close" data-ev-click="{{tag.close}}" data-style="margin-left: auto"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <div data-style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
          <h2 class="dsp" data-style="margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -.02em">{{tag.name}}</h2>
          <sc-for list="{{tag.desc}}" as="d"><p data-style="margin: 0; font-size: 16px; line-height: 1.65; color: #26365a">{{d}}</p></sc-for>
          <span data-style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(44,79,196,.4); background: rgba(44,79,196,.08); color: #16307a; font-size: 14px"><span data-style="width: 7px; height: 7px; border-radius: 50%; background: #2c4fc4"></span>Observed in this pull request</span>
          <div><div class="lbl" data-style="margin-bottom: 8px">In this change</div><p data-style="margin: 0; font-size: 16px; line-height: 1.65; color: #26365a">{{tag.here}}</p></div>
          <div>
            <div class="lbl" data-style="margin-bottom: 10px">{{tag.mitL}}</div>
            <div data-style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{tag.mit}}" as="m"><div data-style="display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-radius: 4px; background: rgba(255,255,255,.7); border: 1px solid rgba(13,27,62,.08)"><span class="mono" data-style="font-size: 13px; color: #2c4fc4">{{m.id}}</span><span data-style="font-size: 15px; line-height: 1.5">{{m.t}}</span></div></sc-for>
            </div>
          </div>
          <sc-if value="{{tag.hasWorld}}" hint-placeholder-val="{{ false }}">
            <div>
              <div class="lbl" data-style="margin-bottom: 10px">Seen in the real world</div>
              <div data-style="display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{tag.world}}" as="w"><div data-style="padding: 14px 16px; border-radius: 4px; background: rgba(15,37,87,.05); border: 1px solid rgba(13,27,62,.08)"><div class="mono" data-style="font-size: 14px; font-weight: 500">{{w.id}}</div><div data-style="font-size: 15px; color: #26365a; margin-top: 4px; line-height: 1.5">{{w.t}}</div></div></sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"startStatus":{"editor":"enum","options":["pending","approved"],"default":"pending"},"$preview":{"width":1440,"height":1000}}'></script>
</body>
</html>
