<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Exhibit A — dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name">Exhibit A</span>
    </div>

    <div class="run-context-card">
      <label class="run-context-label" for="run-select">Current run</label>
      <div class="run-context-select-wrap">
        <select id="run-select" class="run-context-select" aria-label="Current run selector"></select>
        <span class="run-context-id" id="run-current-id">Loading…</span>
        <span class="run-context-chevron" aria-hidden="true">▾</span>
      </div>
      <div class="run-context-sub" id="run-current-sub">Proof before accusation</div>
    </div>

    <nav class="nav-menu" aria-label="Views">
      <a href="#/runs" class="nav-item" data-nav="overview" id="nav-overview">
        <span class="nav-icon" id="icon-overview" aria-hidden="true"></span>
        <span class="nav-text">Overview</span>
      </a>
      <a href="#/replay" class="nav-item" data-nav="liverun" id="nav-liverun">
        <span class="nav-icon" id="icon-liverun" aria-hidden="true"></span>
        <span class="nav-text">Live run</span>
      </a>
      <a href="#/findings" class="nav-item" data-nav="findings" id="nav-findings">
        <span class="nav-icon" id="icon-findings" aria-hidden="true"></span>
        <span class="nav-text">Findings</span>
      </a>
      <a href="#/trends" class="nav-item" data-nav="benchmark" id="nav-benchmark">
        <span class="nav-icon" id="icon-benchmark" aria-hidden="true"></span>
        <span class="nav-text">Benchmark</span>
      </a>
      <a href="#/dependencies" class="nav-item" data-nav="dependencies" id="nav-dependencies">
        <span class="nav-icon" id="icon-dependencies" aria-hidden="true"></span>
        <span class="nav-text">Dependencies</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="env-info">
        <span class="env-icon" id="icon-monitor" aria-hidden="true"></span>
        <div class="env-details">
          <span class="env-label">Local replay</span>
          <span class="env-branch" id="env-branch">main</span>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <span class="theme-toggle-icon" id="icon-theme" aria-hidden="true"></span>
      </button>
    </div>
  </aside>

  <div class="workspace-shell">
    <header class="workspace-header">
      <div class="workspace-header-meta">
        <nav class="breadcrumb" id="header-breadcrumb" aria-label="Breadcrumb">Exhibit A</nav>
        <h1 class="page-title" id="page-title">Run overview</h1>
      </div>
      <div class="workspace-header-actions">
        <button type="button" class="action-btn" id="action-btn">
          <span class="action-btn-icon" id="icon-action" aria-hidden="true"></span>
          <span id="action-btn-text">Export report</span>
        </button>
      </div>
    </header>

    <main id="view" class="data-workspace" aria-live="polite"></main>

    <footer class="record-footer">
      <span class="record-footer-left">Proof before accusation</span>
      <span class="record-footer-right" id="record-footer-right">Illustrative data · Local replay</span>
    </footer>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
